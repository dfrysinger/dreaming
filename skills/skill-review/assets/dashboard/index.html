<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dreaming Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%237c3aed'/%3E%3Cpath d='M20 38c8 2 17-2 22-12-1 13-9 22-22 22z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand"><i></i><span>Dreaming</span></div>
      <nav aria-label="Primary">
        <a href="#overview" data-route="overview">Overview</a>
        <a href="#activity" data-route="activity">Activity</a>
        <a href="#dreams" data-route="dreams">Dreams</a>
        <a href="#candidates" data-route="candidates">Shadow candidates</a>
        <a href="#skills" data-route="skills">Learned skills</a>
        <a href="#system" data-route="system">System</a>
      </nav>
      <div id="runtime" class="runtime">Loading runtime status…</div>
    </aside>
    <main>
      <div id="auth-note" class="notice" hidden>
        Open this dashboard with the <code>dashboard-open</code> installer command.
      </div>
      <div id="error" class="notice error" hidden></div>
      <section id="view" aria-live="polite"></section>
    </main>
  </div>
  <script src="/dashboard.js"></script>
</body>
</html>
